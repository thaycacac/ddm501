# Hai alert của prometheus-course bài 07 (ApiDown, HighErrorRate), giữ nguyên logic.
# Prometheus chỉ ĐÁNH GIÁ rule; gửi cho ai là việc của Alertmanager.
# Label severity từ giờ có ý nghĩa thật: bài 02 định tuyến theo nó.

groups:
  - name: wdbc-api
    rules:
      - alert: ApiDown
        expr: up{job="wdbc-api"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "The prediction API is not answering scrapes"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for 30 seconds."

      - alert: HighErrorRate
        expr: >-
          sum(rate(wdbc_errors_total[1m]))
          /
          (sum(rate(wdbc_errors_total[1m])) + sum(rate(wdbc_predictions_total[1m])))
          > 0.05
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests are failing"
          description: "Current error share: {{ $value | humanizePercentage }}."
