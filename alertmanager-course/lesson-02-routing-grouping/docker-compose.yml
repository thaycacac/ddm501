# =============================================================================
# BÀI 02 — như bài 01, đổi alertmanager.yml (cây route) và rule có label component.
# Tắt stack bài 01 trước (cùng port).
# =============================================================================
#
#   docker compose up -d --build
#   Prometheus    http://127.0.0.1:29090/alerts
#   Alertmanager  http://127.0.0.1:29093
#   webhook-echo  docker compose logs -f webhook-echo
# =============================================================================

name: alertmanager-course-02

services:
  api:
    build:
      context: ../../prometheus-course/lesson-03-instrument-fastapi
      dockerfile: ../lesson-04-prometheus-server/Dockerfile
    container_name: alertmanager-course-02-api
    ports:
      - "28000:8000"
    networks: [monitoring]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: alertmanager-course-02-prometheus
    ports:
      - "29090:9090"
    volumes:
      # prometheus.yml không đổi so với bài 01 → dùng lại, chỉ thay thư mục rule.
      - ../lesson-01-connect-prometheus/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.enable-lifecycle"
    networks: [monitoring]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager-course-02-alertmanager
    ports:
      - "29093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    networks: [monitoring]
    restart: unless-stopped

  webhook-echo:
    image: python:3.11-slim
    container_name: alertmanager-course-02-webhook-echo
    command: ["python", "/app/echo.py"]
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "25001:5001"
    volumes:
      - ../shared/webhook-echo/echo.py:/app/echo.py:ro
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
