# =============================================================================
# BÀI 05 — như bài 04, thêm template tin nhắn, external_labels, external-url.
# Tắt stack bài 04 trước (cùng port).
# =============================================================================
#
#   docker compose --env-file ../.env up -d --build
# =============================================================================

name: alertmanager-course-05

services:
  api:
    build:
      context: ../../prometheus-course/lesson-03-instrument-fastapi
      dockerfile: ../lesson-04-prometheus-server/Dockerfile
    container_name: alertmanager-course-05-api
    ports:
      - "28000:8000"
    networks: [monitoring]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: alertmanager-course-05-prometheus
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.enable-lifecycle"
      # Địa chỉ người dùng mở Prometheus từ trình duyệt. Dùng để tạo generatorURL của alert.
      # Không khai báo → generatorURL chứa hostname của container (thấy ở bài 01), bấm không mở được.
      - "--web.external-url=http://127.0.0.1:29090"
    networks: [monitoring]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager-course-05-alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Như bài 04, thêm --web.external-url → .ExternalURL trong template = link bấm được.
      - >-
        sed "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
        --cluster.listen-address= --web.external-url=http://127.0.0.1:29093
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "29093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      # Thư mục template (tutorial07: ./config/alertmanager/templates).
      - ./templates:/etc/alertmanager/templates:ro
      - ../secrets/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
      - ../lesson-03-inhibit-silence/amtool/config.yml:/etc/amtool/config.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]
    restart: unless-stopped

  webhook-echo:
    image: python:3.11-slim
    container_name: alertmanager-course-05-webhook-echo
    command: ["python", "/app/echo.py"]
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "25001:5001"
    volumes:
      - ../shared/webhook-echo/echo.py:/app/echo.py:ro
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
