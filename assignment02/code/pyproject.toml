[project]
name = "telco-churn-pipeline"
version = "1.1.0"
description = "DDM501 Assignment 2 - reproducible MLflow/Airflow training pipeline for telco churn"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv-airflow", "mlruns", "mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "S", "SIM"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
