# Như prometheus-course bài 07, thêm khối `alerting:` và job scrape Alertmanager.
# (tutorial07: config/prometheus.yml dòng 14–19 và 93–97)

global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Prometheus GỬI alert (đẩy, push) tới Alertmanager. Chiều ngược với scrape (kéo, pull).
# Prometheus chỉ gửi alert đang FIRING (không gửi pending), gửi lại mỗi ~1 phút khi còn cháy,
# và gửi một lần kèm endsAt khi alert hết → Alertmanager biết là resolved.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: wdbc-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: wdbc-api
          env: course

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager cũng có /metrics: alertmanager_alerts, alertmanager_notifications_total...
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
