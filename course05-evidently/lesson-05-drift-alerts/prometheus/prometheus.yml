# Bài 05 (= tutorial07/config/prometheus.yml, chỉ giữ phần liên quan drift)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: course
    env: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# glob: nạp cả bộ rule của khóa lẫn file gốc của tutorial07 (xem docker-compose.yml)
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # tutorial07 dùng scrape_interval 30s cho job này ("drift không đổi thường xuyên").
  # Đúng: gauge chỉ đổi mỗi lần /analyze. Bài học để 15s cho nhanh thấy.
  - job_name: evidently
    static_configs:
      - targets: ["evidently:8001"]
        labels:
          service: evidently

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
