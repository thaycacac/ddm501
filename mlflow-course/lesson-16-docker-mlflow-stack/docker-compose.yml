# =============================================================================
# BÀI 16 — docker-compose.yml: 4 service = tutorial02-extend/docker-compose.yml
# =============================================================================
#
# postgres, minio, minio-init: giống bài 15 (chi tiết ở bài 13, 14).
# MỚI: service mlflow, biến ${...} lấy từ .env, networks khai báo tường minh.
#
#   cp .env.example .env
#   docker compose config           # xem file SAU KHI thay ${...} bằng giá trị .env
#   docker compose up -d --build    # build image mlflow + bật cả 4
#   docker compose ps -a
#   docker compose logs -f mlflow
#   docker compose down -v          # dọn sạch
# =============================================================================

name: mlflow-course-16

services:

  postgres:
    image: postgres:13
    container_name: mlflow-course-16-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      # ${TÊN:-mặc định}: lấy TÊN từ .env (hoặc môi trường); không có thì dùng mặc định
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mlflow_net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mlflow-course-16-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${MINIO_API_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mlflow_net

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: mlflow-course-16-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/mlflow &&
      mc ls local
      "
    networks:
      - mlflow_net

  # ---------------------------------------------------------------------------
  # MỚI: lệnh `mlflow server` của bài 15, giờ chạy trong container
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .              # thư mục chứa Dockerfile + requirements.txt
      dockerfile: Dockerfile
    image: mlflow-course-16-mlflow:2.19.0
    container_name: mlflow-course-16-mlflow
    # Viết dạng list: mỗi phần tử là một đối số, không cần shell, không lo dấu cách.
    # extend viết dạng `/bin/bash -c "mlflow server ..."` — cùng kết quả.
    command:
      - mlflow
      - server
      # postgres:5432 chứ KHÔNG phải 127.0.0.1:25432 — trong container,
      # 127.0.0.1 là chính container mlflow; Postgres là host "postgres" trong mạng
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres:5432/mlflow
      # Chế độ DIRECT (bài 15): client tự upload lên s3://mlflow/artifacts
      - --default-artifact-root
      - s3://mlflow/artifacts
      # 0.0.0.0 = nghe trên MỌI card mạng của container. Nếu để 127.0.0.1,
      # Docker chuyển request từ máy bạn vào sẽ không tới được server.
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      # Server cần key MinIO để UI hiện tab Artifacts (bài 15 bước 2).
      # Endpoint là minio:9000 — nhìn từ TRONG mạng compose.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy                  # pg_isready OK
      minio:
        condition: service_healthy                  # /minio/health/live OK
      minio-init:
        condition: service_completed_successfully   # thoát với mã 0 (bài 14 bước 3)
    healthcheck:
      # python:slim không có curl → dùng urllib (giống bài 03, bài 12)
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Trong 20s đầu, fail không tính — cho server thời gian migrate DB lần đầu
      start_period: 20s
    networks:
      - mlflow_net

volumes:
  pg_data:
  minio_data:

# Không khai báo thì compose cũng tự tạo mạng "<project>_default".
# Khai báo tường minh (như extend dòng 129–132) để đặt tên dễ nhận ra.
networks:
  mlflow_net:
    driver: bridge
    name: mlflow-course-16-net
