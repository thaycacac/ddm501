# =============================================================================
# BÀI 15 — docker-compose.yml: postgres (bài 13) + minio + minio-init (bài 14)
# =============================================================================
#
# Chưa có service mlflow: bài này bạn chạy `mlflow server` bằng tay trên máy,
# để đổi cờ dễ dàng và nhìn log trực tiếp. Bài 16 mới đưa nó vào đây.
#
# Không có gì mới so với bài 13 + 14 — chỉ gộp lại một file. Đọc lại comment
# chi tiết ở lesson-13-postgres-backend/ và lesson-14-minio/ nếu cần.
#
#   docker compose up -d        # bật cả 3 (minio-init chạy xong sẽ Exited (0))
#   docker compose ps -a
#   docker compose down -v      # dọn sạch khi học xong
# =============================================================================

name: mlflow-course-15

services:

  postgres:
    image: postgres:13
    container_name: mlflow-course-15-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "25432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mlflow-course-15-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "29000:9000" # API     — boto3 / MLflow
      - "29001:9001" # Console — trình duyệt
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: mlflow-course-15-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Bucket "mlflow" = phần <bucket> trong s3://mlflow/... mà mlflow server dùng
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/mlflow &&
      mc ls local
      "

volumes:
  pg_data:
  minio_data:
